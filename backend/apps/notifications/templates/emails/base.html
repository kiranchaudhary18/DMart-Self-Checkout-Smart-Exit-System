<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #007bff; margin-bottom: 20px; }
        .header h1 { color: #007bff; margin: 0; }
        .content { font-size: 16px; }
        .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DMart Self Checkout</h1>
        </div>
        <div class="content">
            <p>Dear {{ customer.get_full_name|default:customer.email }},</p>
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>Thank you for shopping with DMart!</p>
            <p>If you have any questions, please contact our support team at support@dmart.com.</p>
        </div>
    </div>
</body>
</html>
