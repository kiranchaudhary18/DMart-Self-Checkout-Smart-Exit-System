          description: ''
    patch:
      operationId: stores_current_partial_update
      tags:
      - stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStore'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStore'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStore'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Inventory:
      type: object
      properties:
        product:
          type: integer
          description: The product this inventory record belongs to.
        product_name:
          type: string
          readOnly: true
        barcode:
          type: string
          readOnly: true
        current_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        reserved_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        available_stock:
          type: integer
          readOnly: true
        low_stock_threshold:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_low_stock:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - available_stock
      - barcode
      - created_at
      - is_low_stock
      - product
      - product_name
      - updated_at
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedInventoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Inventory'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PaginatedStockTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/StockTransaction'
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          description: Category this product belongs to. Cannot delete a category
            if products exist.
        name:
          type: string
          maxLength: 255
        barcode:
          type: string
          description: Scan barcode
          maxLength: 100
        sku:
          type: string
          maxLength: 100
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        gst_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        unit:
          $ref: '#/components/schemas/UnitEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedStore:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Configurable name of the store.
          maxLength: 255
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        pincode:
          type: string
          maxLength: 20
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        opening_time:
          type: string
          format: time
        closing_time:
          type: string
          format: time
        is_open:
          type: boolean
        gst_number:
          type: string
          nullable: true
          description: GST Number for billing.
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 20
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          description: Category this product belongs to. Cannot delete a category
            if products exist.
        name:
          type: string
          maxLength: 255
        barcode:
          type: string
          description: Scan barcode
          maxLength: 100
        sku:
          type: string
          maxLength: 100
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        gst_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        unit:
          $ref: '#/components/schemas/UnitEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - barcode
      - category
      - created_at
      - gst_percentage
      - id
      - name
      - price
      - sku
    RoleEnum:
      enum:
      - CUSTOMER
      - SECURITY
      - ADMIN
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `SECURITY` - Security
        * `ADMIN` - Admin
    StockTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Absolute quantity changed
        previous_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        new_stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        reason:
          type: string
          description: Reason for adjustment/damage/etc.
        reference_id:
          type: string
          nullable: true
          description: Order ID or Receipt ID reference
          maxLength: 100
        created_by:
          type: integer
          nullable: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by_name
      - id
      - new_stock
      - previous_stock
      - product
      - product_name
      - quantity
      - transaction_type
    Store:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Configurable name of the store.
          maxLength: 255
        address:
          type: string
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        pincode:
          type: string
          maxLength: 20
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        opening_time:
          type: string
          format: time
        closing_time:
          type: string
          format: time
        is_open:
          type: boolean
        gst_number:
          type: string
          nullable: true
          description: GST Number for billing.
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - city
      - closing_time
      - created_at
      - email
      - id
      - name
      - opening_time
      - phone
      - pincode
      - state
      - updated_at
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TransactionTypeEnum:
      enum:
      - INITIAL
      - RESTOCK
      - SALE
      - ADJUSTMENT
      - RETURN
      - DAMAGE
      - EXPIRED
      type: string
      description: |-
        * `INITIAL` - Initial Stock
        * `RESTOCK` - Restock
        * `SALE` - Sale
        * `ADJUSTMENT` - Adjustment
        * `RETURN` - Return
        * `DAMAGE` - Damage
        * `EXPIRED` - Expired
    UnitEnum:
      enum:
      - PIECE
      - KG
      - GRAM
      - LITRE
      - ML
      - PACK
      type: string
      description: |-
        * `PIECE` - Piece
        * `KG` - Kilogram
        * `GRAM` - Gram
        * `LITRE` - Litre
        * `ML` - Millilitre
        * `PACK` - Pack
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_active
      - name
      - phone
      - role
      - updated_at
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - email
      - password
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 20
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
